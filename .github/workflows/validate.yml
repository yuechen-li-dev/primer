name: Validate primers
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts-and-examples:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Select stable Rust
        run: rustup update stable --no-self-update
      - name: Select Rust default
        run: rustup default stable
      - name: Install Python check tools
        run: python -m pip install -r requirements-dev.txt
      - name: Validate contracts
        run: python tools/validate.py
      - name: Test validator failures
        run: python -m unittest discover -s tests -v
      - name: Type-check validator
        run: python -m mypy --strict tools/validate.py
      - name: Record toolchain versions
        run: |
          python --version
          dotnet --version
          rustc --version
          g++ --version
      - name: Compile and run canonical examples
        run: python tools/validate.py --examples all
